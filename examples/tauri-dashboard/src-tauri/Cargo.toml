[package]
name = "freedom-finger-tauri-dashboard"
version = "0.5.0"
description = "Freedom Finger untuk pengguna akhir: server absensi dan dashboard realtime dalam satu aplikasi; juga contoh pemakaian SDK"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Contoh berdiri sendiri, bukan bagian workspace root.
[workspace]

# Pola template Tauri v2: kode aplikasi di src/lib.rs, src/main.rs hanya memanggil `run()`.
# Akhiran _lib supaya nama library tidak bentrok dengan nama program di Windows.
[lib]
name = "freedom_finger_tauri_dashboard_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
freedom-finger = { path = "../../../crates/freedom-finger" }
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
