name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rustup membaca rust-toolchain.toml (versi, rustfmt, clippy) saat cargo pertama dipanggil
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Pasang sebagai layanan sungguhan (runner punya hak admin), matikan paksa, pastikan hidup lagi, lalu lepas.
  install:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: install, matikan paksa, hidup lagi, uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          up() { for i in $(seq 40); do curl -sf http://127.0.0.1:8013/status.json && return 0; sleep 1; done; return 1; }
          cp target/release/freedom-finger ./freedom-finger-unduhan   # seperti file rilis: nama lain
          sudo ./freedom-finger-unduhan install
          up
          sudo pkill -9 -x freedom-finger   # -x: nama proses persis (-f ikut mencocokkan baris perintah pkill sendiri)
          sleep 3
          up
          TOKEN=$(sudo grep '^FKWEB_TOKEN=' /opt/freedom-finger/freedom-finger.env | cut -d= -f2)
          curl -sf -X POST http://127.0.0.1:8013/api/get_devices -H "Authorization: Bearer $TOKEN" -d '{}'
          ./target/release/freedom-finger status
          sudo ./target/release/freedom-finger uninstall
          sleep 2
          ! curl -sf http://127.0.0.1:8013/status.json
      - name: install, matikan paksa, hidup lagi, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Up { for ($i = 0; $i -lt 40; $i++) { try { return Invoke-RestMethod http://127.0.0.1:8013/status.json } catch { Start-Sleep 1 } }; throw "server tidak hidup" }
          Copy-Item .\target\release\freedom-finger.exe .\freedom-finger-unduhan.exe   # nama lain; terpasang sebagai freedom-finger.exe
          .\freedom-finger-unduhan.exe install
          if ($LASTEXITCODE) { exit 1 }
          Up
          Stop-Process -Name freedom-finger -Force
          Start-Sleep 3
          Up
          $token = (Select-String -Path C:\FreedomFinger\freedom-finger.env -Pattern '^FKWEB_TOKEN=(.+)').Matches[0].Groups[1].Value
          Invoke-RestMethod -Method Post http://127.0.0.1:8013/api/get_devices -Headers @{ Authorization = "Bearer $token" } -Body '{}'
          .\target\release\freedom-finger.exe status
          # klien /api/events yang masih tersambung tidak boleh menahan layanan berhenti
          Start-Process curl.exe -ArgumentList '-sN', '-H', "Authorization: Bearer $token", 'http://127.0.0.1:8013/api/events' -NoNewWindow
          Start-Sleep 1
          $t = Measure-Command { .\target\release\freedom-finger.exe uninstall }
          if ($LASTEXITCODE) { exit 1 }
          if ($t.TotalSeconds -gt 15) { throw "layanan berhenti terlalu lama: $($t.TotalSeconds) detik" }

  # Contoh Tauri memakai API crate (serve, Config, banner, Store): pastikan tetap terkompilasi dan lulus uji.
  tauri-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri-dashboard/src-tauri
      - run: cargo clippy --manifest-path examples/tauri-dashboard/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/tauri-dashboard/src-tauri/Cargo.toml
      # aturan rekap (hitung-rekap.js), tanpa dependency npm
      - run: npm test
        working-directory: examples/tauri-dashboard

  # Contoh web (Bun): uji server web dengan server Freedom Finger tiruan, aturan rekap, dan tipe TypeScript.
  bun-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bun-web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check

  # Contoh web (Next.js): uji login, sesi, dan aturan rekap; tipe TypeScript; build produksi.
  next-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/next-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/next-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
