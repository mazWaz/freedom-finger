name: Release

# Tag v* → program server untuk 5 target (file langsung, tanpa zip/tar) dan installer aplikasi
# desktop untuk Windows, macOS, Linux, lalu terbit di GitHub Releases. Jalankan manual (workflow_dispatch) untuk menguji build saja: hasilnya bisa diunduh
# dari halaman run, tanpa rilis.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: freedom-finger.exe }
          # musl: satu file statis, jalan di distro Linux mana pun (tanpa ketergantungan versi glibc)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: freedom-finger-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: freedom-finger-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: freedom-finger-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: freedom-finger-macos-x64 }
    runs-on: ${{ matrix.os }}
    env:
      # Windows: CRT statis, supaya jalan di PC bersih tanpa Visual C++ Redistributable
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: file rilis
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/freedom-finger${{ runner.os == 'Windows' && '.exe' || '' }} dist/${{ matrix.asset }}
      - name: jalan? (target yang sama dengan runner)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: dist/${{ matrix.asset }} --version
      # Linux minimal (Alpine: tanpa glibc dan tanpa tzdata): server harus hidup dan menjawab
      - name: jalan di Alpine?
        if: contains(matrix.target, 'musl')
        run: >-
          docker run --rm -v "$PWD/dist:/ff" alpine:3 sh -c
          '/ff/${{ matrix.asset }} --data /tmp/d & for i in $(seq 20); do wget -qO- http://127.0.0.1:8013/status.json && exit 0; sleep 0.5; done; exit 1'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  # Aplikasi desktop untuk pengguna akhir (examples/tauri-dashboard): server tertanam + dashboard.
  # Paket update ditandatangani kunci updater Tauri (secret pemilik repo); job release membuat latest.json.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundles: nsis }
          # app: .app.tar.gz untuk update otomatis
          - { os: macos-latest, bundles: 'app,dmg', target: universal-apple-darwin }
          # Ubuntu 22.04: glibc lebih lama, jadi .deb dan .AppImage jalan di distro yang lebih tua juga
          - { os: ubuntu-22.04, bundles: 'deb,appimage' }
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
        working-directory: examples/tauri-dashboard
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - if: matrix.target
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: build installer (versi = tag)
        run: |
          v=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && v=${GITHUB_REF_NAME#v}
          npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config "{\"version\":\"$v\"}"
      - name: file rilis
        run: |
          mkdir -p ../../dist
          b=src-tauri/target/${{ matrix.target || '.' }}/release/bundle
          # .sig = tanda tangan paket update (isinya masuk latest.json)
          case "$RUNNER_OS" in
            Windows) cp "$b"/nsis/*-setup.exe ../../dist/freedom-finger-desktop-windows-x64-setup.exe
                     cp "$b"/nsis/*-setup.exe.sig ../../dist/freedom-finger-desktop-windows-x64-setup.exe.sig ;;
            macOS) cp "$b"/dmg/*.dmg ../../dist/freedom-finger-desktop-macos.dmg
                   cp "$b"/macos/*.app.tar.gz ../../dist/freedom-finger-desktop-macos.app.tar.gz
                   cp "$b"/macos/*.app.tar.gz.sig ../../dist/freedom-finger-desktop-macos.app.tar.gz.sig ;;
            Linux) cp "$b"/deb/*.deb ../../dist/freedom-finger-desktop-linux-x64.deb
                   cp "$b"/appimage/*.AppImage ../../dist/freedom-finger-desktop-linux-x64.AppImage
                   cp "$b"/appimage/*.AppImage.sig ../../dist/freedom-finger-desktop-linux-x64.AppImage.sig
                   npx tauri signer sign ../../dist/freedom-finger-desktop-linux-x64.deb ;;
          esac
          ls -la ../../dist
      # PC Windows bersih: pasang, firewall terbuka, server di dalam aplikasi menjawab, lalu uninstall bersih
      - name: uji installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          Start-Process -Wait .\freedom-finger-desktop-windows-x64-setup.exe -ArgumentList '/S'
          netsh advfirewall firewall show rule name=FreedomFingerApp
          if ($LASTEXITCODE) { throw "aturan firewall tidak dibuat" }
          $dir = 'C:\Program Files\Freedom Finger'
          $exe = Get-ChildItem "$dir\*.exe" | Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          $app = Start-Process $exe.FullName -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { try { Invoke-RestMethod http://127.0.0.1:8013/status.json; $ok = $true } catch { Start-Sleep 1 } }
          Stop-Process -Id $app.Id -Force
          if (-not $ok) { throw "aplikasi tidak menjawab di port 8013" }
          Start-Process -Wait "$dir\uninstall.exe" -ArgumentList '/S'
          netsh advfirewall firewall show rule name=FreedomFingerApp | Out-Null
          if (-not $LASTEXITCODE) { throw "aturan firewall tidak dihapus saat uninstall" }
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/*

  release:
    needs: [build, app]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # update otomatis: aplikasi terpasang membaca releases/latest/download/latest.json (plugins.updater)
      - name: latest.json
        run: |
          u="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          p() { jq -n --arg url "$u/$1" --arg signature "$(cat "dist/$1.sig")" '{url: $url, signature: $signature}'; }
          mac=$(p freedom-finger-desktop-macos.app.tar.gz)
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg pub_date "$(date -u +%FT%TZ)" --argjson win "$(p freedom-finger-desktop-windows-x64-setup.exe)" \
            --argjson mac "$mac" --argjson appimage "$(p freedom-finger-desktop-linux-x64.AppImage)" --argjson deb "$(p freedom-finger-desktop-linux-x64.deb)" \
            '{version: $version, pub_date: $pub_date, platforms: {"windows-x86_64": $win, "darwin-aarch64": $mac, "darwin-x86_64": $mac,
              "linux-x86_64": $appimage, "linux-x86_64-deb": $deb}}' > dist/latest.json
          rm dist/*.sig
          cat dist/latest.json
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: terbitkan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Pengguna:** pasang aplikasi desktop (server absensi dan dashboard dalam satu aplikasi). Aplikasi jalan sendiri setiap login dan tetap di tray; absen selama PC mati disusul otomatis saat aplikasi hidup.

          | Komputer | Installer aplikasi desktop |
          |---|---|
          | Windows 10/11 64-bit | `freedom-finger-desktop-windows-x64-setup.exe` |
          | Mac (Apple Silicon dan Intel) | `freedom-finger-desktop-macos.dmg` |
          | Linux 64-bit | `freedom-finger-desktop-linux-x64.deb` atau `.AppImage` |

          Aplikasi desktop v0.4.0 ke atas memberi tahu sendiri bila ada versi baru (tombol di kiri bawah) dan memasangnya setelah disetujui.

          **Developer (SDK):** program server `freedom-finger` untuk dipasang sendiri (`freedom-finger install` = layanan 24 jam). Dokumentasi API: `docs/api.md`.

          | Komputer | Program server |
          |---|---|
          | Windows 64-bit | `freedom-finger.exe` |
          | Linux 64-bit | `freedom-finger-linux-x64` |
          | Linux ARM64 (Raspberry Pi 4/5, server ARM) | `freedom-finger-linux-arm64` |
          | Mac Apple Silicon / Intel | `freedom-finger-macos-arm64` / `freedom-finger-macos-x64` |

          Belum bertanda tangan. Windows: bila muncul "Windows protected your PC", klik **More info → Run anyway**. macOS: bila aplikasi ditolak, jalankan `xattr -cr "/Applications/Freedom Finger.app"`; untuk program server: `chmod +x` lalu `xattr -d com.apple.quarantine <file>`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Freedom Finger $GITHUB_REF_NAME" --notes-file notes.md
